name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: file:./dev.db

      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Sync Capacitor Android
        run: npx cap sync android --verbose
        env:
          CAPACITOR_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alinea-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
